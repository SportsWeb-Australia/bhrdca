<script>
(function () {
  var B = window.BHRDCA_BIOS || [];
  var grid = document.getElementById("bio-grid");
  document.getElementById("bio-note").innerHTML = "Showing <strong>" + B.length + "</strong> biographies.";
  grid.innerHTML = B.map(function (b) {
    return '<a class="bio-card" href="' + b.url + '" target="_blank" rel="noopener">'
      + '<span class="bio-ic"><i class="ti ti-file-text"></i></span>'
      + '<span class="bio-nm">' + b.name + '</span>'
      + '<i class="ti ti-chevron-right bio-arrow"></i>'
      + '</a>';
  }).join("");
})();
</script>
