<header class="page-hero">
  <div class="page-hero-inner wide">
    <div class="crumb"><a href="/index.html">Home</a> <i class="ti ti-chevron-right"></i> Association · Club Contacts</div>
    <div class="eyebrow">Directory</div>
    <h1>Club Contacts</h1>
    <p class="page-sub">The Association's committee and every affiliated club's contacts for the current season, all in one place.</p>
  </div>
</header>

<div class="page-wrap wide">
  <div class="section-block">
    <div class="cc-folder">
      <div class="cc-tabbar">
        <div class="cc-tabs" id="cc-tabs" role="tablist"></div>
        <div class="cc-tag" id="cc-season"></div>
      </div>
      <div class="cc-body">
        <div id="cc-panel"></div>
      </div>
    </div>
  </div>
</div>

<div data-bhrdca="sponsor-carousel"></div>
<div data-bhrdca="footer"></div>
<script src="/site-data.js"></script>
<script src="/club-contacts-data.js"></script>
<script>
(function () {
  var D = window.BHRDCA_CLUB_CONTACTS || {};
  var CLUBS = (window.BHRDCA_DATA || {}).clubs || [];
  function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function tel(p){ return p ? p.replace(/[^0-9+]/g,"") : ""; }
  function initials(name){
    var words = String(name).replace(/[^A-Za-z0-9 &\/-]/g," ").split(/[ \/&-]+/).filter(Boolean);
    return (words.slice(0,3).map(function(w){ return w[0]; }).join("").toUpperCase()) || "C";
  }
  function normClub(s){ return String(s || "").toLowerCase().replace(/cricket club|c\.c\.c?\.?/g,"").replace(/[^a-z0-9]/g,""); }

  var CLUB_LOOKUP = CLUBS.map(function (c) { return { norm: normClub(c.name), logo: c.logo, name: c.name }; });
  function findLogo(clubName) {
    var target = normClub(clubName);
    if (!target) return null;
    for (var i = 0; i < CLUB_LOOKUP.length; i++) {
      var rn = CLUB_LOOKUP[i].norm;
      if (rn === target || rn.indexOf(target) === 0 || target.indexOf(rn) === 0) return CLUB_LOOKUP[i];
    }
    return null;
  }
  function crestFor(clubName) {
    var hit = findLogo(clubName);
    if (hit && hit.logo) {
      return '<span class="cc-crest has-logo"><img src="' + esc(hit.logo) + '" alt="" loading="lazy" onerror="this.parentNode.classList.remove(\'has-logo\');this.remove();this.parentNode.textContent=\'' + esc(initials(clubName)) + '\'"></span>';
    }
    return '<span class="cc-crest">' + esc(initials(clubName)) + '</span>';
  }

  var mapIdSeq = 0;
  function mapBlockFor(clubName) {
    var id = "cc-map-" + (mapIdSeq++);
    var base = String(clubName).replace(/\s*\b(CC|C\.C\.?)\b\s*$/i, "").trim();
    var query = /cricket/i.test(base) ? base : (base + " Cricket Club");
    var mapUrl = "https://www.google.com/maps?q=" + encodeURIComponent(query + ", Victoria, Australia") + "&output=embed";
    return {
      btn: '<button class="cc-map-btn" data-map="' + id + '" title="View on map" aria-label="View ' + esc(clubName) + ' on map"><i class="ti ti-map-pin"></i></button>',
      panel: '<div class="cc-map" id="' + id + '" data-src="' + esc(mapUrl) + '" hidden></div>'
    };
  }

  document.getElementById("cc-season").innerHTML = '<i class="ti ti-calendar-event"></i> ' + esc(D.season || "");

  var TABS = [
    { key: "committee",        label: "BHRDCA Committee",    icon: "ti-shield-star",  n: (D.committee || []).length },
    { key: "seniorClubs",      label: "Senior Clubs",        icon: "ti-ball-cricket", n: (D.seniorClubs || []).length },
    { key: "treasurers",       label: "Club Treasurers",     icon: "ti-cash",         n: (D.treasurers || []).length },
    { key: "juniorClubs",      label: "Junior Clubs",        icon: "ti-shirt-sport",  n: (D.juniorClubs || []).length },
    { key: "femaleClubs",      label: "Female Clubs",        icon: "ti-shirt-sport",  n: (D.femaleClubs || []).length },
    { key: "juniorFemaleClubs",label: "Junior Female Clubs", icon: "ti-shirt-sport",  n: (D.juniorFemaleClubs || []).length }
  ];

  var tabsEl = document.getElementById("cc-tabs");
  tabsEl.innerHTML = TABS.map(function (t, i) {
    return '<button class="cc-tab' + (i === 0 ? ' active' : '') + '" data-key="' + t.key + '" role="tab">'
      + '<i class="ti ' + t.icon + '"></i><span>' + esc(t.label) + '</span><span class="cc-tab-n">' + t.n + '</span></button>';
  }).join("");

  function contactRow(p) {
    var email = p.email ? '<a href="mailto:' + esc(p.email) + '" title="' + esc(p.email) + '"><i class="ti ti-mail"></i></a>' : "";
    var phone = p.phone ? '<a href="tel:' + tel(p.phone) + '" title="' + esc(p.phone) + '"><i class="ti ti-phone"></i></a>' : "";
    return { email: email, phone: phone };
  }

  function renderCommittee(list) {
    return '<div class="cc-grid" id="cc-grid">' + list.map(function (c) {
      return '<div class="cc-card" data-hay="' + esc((c.name + " " + c.role).toLowerCase()) + '">'
        + '<div class="cc-card-nm">' + esc(c.name) + '</div>'
        + '<div class="cc-card-role">' + esc(c.role) + '</div>'
        + (c.phone ? '<a href="tel:' + tel(c.phone) + '"><i class="ti ti-phone"></i>' + esc(c.phone) + '</a>' : '')
        + (c.email ? '<a href="mailto:' + esc(c.email) + '"><i class="ti ti-mail"></i>' + esc(c.email) + '</a>' : '')
        + '</div>';
    }).join("") + '</div>';
  }

  function renderSeniorClubs(list) {
    return '<div class="cc-grid" id="cc-grid">' + list.map(function (c) {
      var hay = (c.club + " " + c.people.map(function(p){return p.name + " " + p.role;}).join(" ")).toLowerCase();
      var body = c.people.length
        ? c.people.map(function (p) {
            var cr = contactRow(p);
            return '<div class="cc-person"><div class="cc-person-l"><div class="cc-person-nm">' + esc(p.name) + '</div><div class="cc-person-role">' + esc(p.role || "") + '</div></div><div class="cc-person-c">' + cr.phone + cr.email + '</div></div>';
          }).join("")
        : '<div class="cc-none">Contact details to come</div>';
      var map = mapBlockFor(c.club);
      return '<div class="cc-club" data-hay="' + esc(hay) + '">'
        + '<div class="cc-club-hd">' + crestFor(c.club) + '<span>' + esc(c.club) + '</span>' + map.btn + '</div>'
        + '<div class="cc-club-body">' + body + '</div>'
        + map.panel
        + '</div>';
    }).join("") + '</div>';
  }

  function renderFlatList(list) {
    return '<div class="cc-grid" id="cc-grid">' + list.map(function (r) {
      var hay = (r.club + " " + (r.name||"") + " " + (r.role||"")).toLowerCase();
      var hasPerson = !!r.name;
      var map = mapBlockFor(r.club);
      return '<div class="cc-club" data-hay="' + esc(hay) + '">'
        + '<div class="cc-club-hd">' + crestFor(r.club) + '<span>' + esc(r.club) + '</span>' + map.btn + '</div>'
        + '<div class="cc-club-body">'
        + (hasPerson
            ? '<div class="cc-person"><div class="cc-person-l"><div class="cc-person-nm">' + esc(r.name) + '</div>' + (r.role ? '<div class="cc-person-role">' + esc(r.role) + '</div>' : '') + '</div><div class="cc-person-c">' + contactRow(r).phone + contactRow(r).email + '</div></div>'
            : '<div class="cc-none">Contact details to come</div>')
        + '</div>'
        + map.panel
        + '</div>';
    }).join("") + '</div>';
  }

  var RENDERERS = {
    committee: renderCommittee,
    seniorClubs: renderSeniorClubs,
    treasurers: renderFlatList,
    juniorClubs: renderFlatList,
    femaleClubs: renderFlatList,
    juniorFemaleClubs: renderFlatList
  };

  var SUBS = {
    committee: "The Association's Committee of Management, " + D.season + ".",
    seniorClubs: "Senior club presidents, secretaries and other office bearers, " + D.season + ".",
    treasurers: "One treasurer contact per affiliated club, " + D.season + ".",
    juniorClubs: "Junior coordinators for every affiliated club (mixed), " + D.season + ".",
    femaleClubs: "Senior female/women's cricket coordinators by club, " + D.season + ".",
    juniorFemaleClubs: "Junior girls' cricket coordinators by club, " + D.season + "."
  };

  var panel = document.getElementById("cc-panel");

  function showTab(key) {
    var tab = TABS.filter(function (t) { return t.key === key; })[0];
    var list = D[key] || [];
    var html = '<div class="cc-panel-head">'
      + '<div><div class="cc-panel-title">' + esc(tab.label) + '</div><div class="cc-panel-sub">' + esc(SUBS[key] || "") + '</div></div>'
      + '<div class="cc-search-wrap"><i class="ti ti-search"></i><input class="cc-search" type="search" id="cc-search" placeholder="Search ' + esc(tab.label).toLowerCase() + '…" aria-label="Search"></div>'
      + '</div>'
      + RENDERERS[key](list);
    panel.innerHTML = html;

    var input = document.getElementById("cc-search");
    input.addEventListener("input", function () {
      var q = this.value.toLowerCase().trim();
      var cards = document.querySelectorAll("#cc-grid > [data-hay]");
      var hits = 0;
      cards.forEach(function (el) {
        var show = !q || el.getAttribute("data-hay").indexOf(q) > -1;
        el.style.display = show ? "" : "none";
        if (show) hits++;
      });
      var empty = document.getElementById("cc-empty-hit");
      if (!hits) {
        if (!empty) {
          var d = document.createElement("div");
          d.id = "cc-empty-hit"; d.className = "cc-empty-hit";
          d.textContent = "No matches for “" + this.value + "”.";
          document.getElementById("cc-grid").appendChild(d);
        }
      } else if (empty) empty.remove();
    });
  }

  panel.addEventListener("click", function (e) {
    var btn = e.target.closest(".cc-map-btn");
    if (!btn) return;
    var mapEl = document.getElementById(btn.getAttribute("data-map"));
    if (!mapEl) return;
    var open = !mapEl.hidden;
    if (open) {
      mapEl.hidden = true;
      btn.classList.remove("active");
    } else {
      if (!mapEl.childElementCount) {
        var iframe = document.createElement("iframe");
        iframe.src = mapEl.getAttribute("data-src");
        iframe.loading = "lazy";
        iframe.referrerPolicy = "no-referrer-when-downgrade";
        iframe.setAttribute("title", "Map");
        mapEl.appendChild(iframe);
      }
      mapEl.hidden = false;
      btn.classList.add("active");
    }
  });

  tabsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".cc-tab");
    if (!btn) return;
    tabsEl.querySelectorAll(".cc-tab").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    showTab(btn.getAttribute("data-key"));
  });

  showTab(TABS[0].key);
})();
</script>
