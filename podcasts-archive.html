<body data-page="podcasts">

<div data-bhrdca="masthead"></div>
<div data-bhrdca="ticker"></div>

<header class="page-hero">
  <div class="page-hero-inner wide">
    <div class="crumb"><a href="/index.html">Home</a> <i class="ti ti-chevron-right"></i> <a href="/podcasts.html">Podcasts</a> <i class="ti ti-chevron-right"></i> Archive</div>
    <div class="eyebrow">Look Back</div>
    <h1>Podcast Archive</h1>
    <p class="page-sub">Past seasons of The Cordon Radio Show.</p>
  </div>
</header>

<div class="page-wrap wide">
  <div class="section-block" id="pod-archive-mount"></div>
</div>

<div data-bhrdca="sponsor-carousel"></div>
<div data-bhrdca="footer"></div>
<script src="/podcasts-data.js"></script>
<script>
(function () {
  var archive = (window.BHRDCA_PODCASTS || {}).archive || [];
  var mount = document.getElementById("pod-archive-mount");
  if (!archive.length) {
    mount.innerHTML = '<div class="pod-empty"><i class="ti ti-archive"></i><h3>No past seasons yet</h3><p>Once the current season wraps, its episodes will be archived here.</p></div>';
    return;
  }
  mount.innerHTML = archive.map(function (season) {
    var eps = (season.episodes || []).map(function (e) {
      return '<a class="tile" href="' + e.url + '" target="_blank" rel="noopener">'
        + '<div class="tile-ic"><i class="ti ti-microphone-2"></i></div>'
        + '<div><div class="tile-tt">' + e.title + '</div></div>'
        + '<i class="ti ti-chevron-right"></i>'
        + '</a>';
    }).join("");
    return '<div class="pod-season-block">'
      + '<div class="block-hed">' + season.season + ' Season</div>'
      + (season.note ? '<div class="block-sub">' + season.note + '</div>' : '')
      + '<div class="tile-grid" style="margin-top:14px">' + eps + '</div>'
      + '</div>';
  }).join("");
})();
</script>
  <script src="/sitepulse-widget.js" data-club-id="c944eff6-3d36-4b70-8b49-23dc70673397" data-source="onboarding"></script>
