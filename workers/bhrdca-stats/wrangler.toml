name = "bhrdca-stats"
main = "src/index.js"
compatibility_date = "2026-09-01"

# BHRDCA public data (safe to commit — the API KEY is a secret, set separately)
[vars]
PHQ_HOST = "https://api.playhq.com"
PHQ_TENANT = "ca"
ORG_ID = "f8c1124c-c0cd-4b6f-b513-0e2c1340978b"

# --- SportsWeb One push (additive; the leaderboard does not depend on it) ---
# Off unless this says exactly "true". With it off the Worker behaves as it did
# before this was added. TRAINING endpoint only for now.
SW1_PUSH_ENABLED = "true"
SW1_INGEST_URL   = "https://jgziqwowavhuqpbmzxhs.supabase.co/functions/v1/playhq-ingest"
SW1_PUSH_GRADE_LIMIT = "2"
# Secret, set with `npx wrangler secret put PLAYHQ_INGEST_SECRET`:
#   PLAYHQ_INGEST_SECRET  the signing secret SW1 shares. NOT a Supabase key --
#   this Worker holds no database credential of any kind.

# KV for the computed board + per-game cache.
# Create with:  npx wrangler kv namespace create STATS
# then paste the returned id below.
[[kv_namespaces]]
binding = "STATS"
id = "3a2d2122647244928dbb3ea812bb6678"

# Scheduled aggregation. Off-season / completed-season data is static, so hourly
# keeps KV reads well inside the free tier (re-aggregating reads every cached game).
# Drop back to "*/15 * * * *" (or tighter) once a LIVE season needs frequent updates
# — ideally alongside the Workers Paid plan, which lifts both the subrequest and KV caps.
[triggers]
crons = ["0 * * * *"]
